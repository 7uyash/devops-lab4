name: Task 6 - Secret management with HashiCorp Vault

on:
  push:
    branches: [main]
    paths: ["vault/**", "app/vault_client.py", ".github/workflows/secrets.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: vault

env:
  RUN: 'run(){ echo "$ $*"; eval "$@"; echo; }'
  # V = vault CLI inside the Vault container; the token comes from $VT and is never printed
  V: 'V(){ docker compose exec -T -e VAULT_TOKEN="$VT" vault vault "$@"; }'

jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start Vault (sealed) and PostgreSQL
        run: |
          eval "$RUN"
          S="$RUNNER_TEMP/vault-secrets"; rm -rf "$S"; mkdir -p "$S/app" "$S/bootstrap"; chmod 700 "$S"
          chmod 755 "$S/app" "$S/bootstrap"
          { echo "S=$S"; echo "APP_SECRETS_DIR=$S/app"; echo "BOOTSTRAP_DIR=$S/bootstrap"; } >> "$GITHUB_ENV"
          export APP_SECRETS_DIR="$S/app" BOOTSTRAP_DIR="$S/bootstrap"
          # one-time bootstrap password: generated here, never in git or logs, rotated by Vault later
          openssl rand -hex 16 | tr -d '\n' > "$S/bootstrap/db_bootstrap"; chmod 644 "$S/bootstrap/db_bootstrap"
          docker build -q -t shoplite:1.0.0 ../app >/dev/null
          run "docker compose up -d --wait --quiet-pull 2>&1 | tail -3"
          sleep 2
          run "docker compose exec -T vault vault status || true"

      - name: Initialise and unseal (Shamir 3-of-5)
        run: |
          eval "$RUN"
          docker compose exec -T vault vault operator init -key-shares=5 -key-threshold=3 -format=json > "$S/init.json"
          chmod 600 "$S/init.json"
          echo "$ vault operator init -key-shares=5 -key-threshold=3 -format=json > \$RUNNER_TEMP/init.json   (mode 600)"
          echo "# shown redacted: real unseal keys go to 5 different key holders (or a cloud KMS), never to logs or git"
          jq '{unseal_keys_b64: [.unseal_keys_b64[] | .[0:4] + "****"], unseal_shares, unseal_threshold, root_token: (.root_token[0:4] + "****")}' "$S/init.json"
          echo
          for i in 0 1 2; do
            echo "$ vault operator unseal <key $((i + 1))>"
            docker compose exec -T vault vault operator unseal "$(jq -r ".unseal_keys_b64[$i]" "$S/init.json")" | grep -E '^(Sealed|Unseal Progress)'
          done
          echo
          run "docker compose exec -T vault vault status | grep -E 'Initialized|Sealed|Total Shares|Threshold|Version|Storage Type'"

      - name: Configure Vault - audit, KV, dynamic DB credentials, policies, AppRole
        run: |
          eval "$RUN"; eval "$V"
          export VT=$(jq -r .root_token "$S/init.json")
          run "V audit enable file file_path=/vault/logs/audit.log"
          run "V secrets enable -path=secret kv-v2"
          echo "$ openssl rand -hex 24 | vault kv put -mount=secret shoplite/config payment_api_key=-   (value never displayed)"
          openssl rand -hex 24 | tr -d '\n' > "$S/payment_key"; chmod 600 "$S/payment_key"
          V kv put -mount=secret shoplite/config payment_api_key=- < "$S/payment_key" | grep -E 'version|created_time'
          echo
          run "V secrets enable database"
          echo "$ vault write database/config/shop plugin_name=postgresql-database-plugin allowed_roles=shoplite-app connection_url='postgresql://{{username}}:{{password}}@db:5432/shop' username=vaultadmin password=<bootstrap>"
          V write database/config/shop plugin_name=postgresql-database-plugin allowed_roles=shoplite-app \
            "connection_url=postgresql://{{username}}:{{password}}@db:5432/shop?sslmode=disable" \
            username=vaultadmin "password=$(cat "$S/bootstrap/db_bootstrap")"
          echo
          echo "# rotate the bootstrap password - from now on only Vault knows the database admin password"
          run "V write -f database/rotate-root/shop"
          run "cat policies/shoplite-app-role.sql"
          run "V write database/roles/shoplite-app db_name=shop default_ttl=10m max_ttl=1h creation_statements=@/vault/policies/shoplite-app-role.sql"
          for p in shoplite-app deployer ops; do run "V policy write $p /vault/policies/$p.hcl"; done
          run "V auth enable approle"
          run "V write auth/approle/role/shoplite-app token_policies=shoplite-app token_ttl=15m token_max_ttl=1h secret_id_ttl=10m secret_id_num_uses=1"
          echo "# short-lived tokens for the pipeline (deployer) and operators (ops); then the root token is revoked"
          V token create -policy=deployer -ttl=30m -orphan -field=token > "$S/deployer_token"
          V token create -policy=ops -ttl=1h -orphan -field=token > "$S/ops_token"
          chmod 600 "$S/deployer_token" "$S/ops_token"
          echo "$ vault token create -policy=deployer -ttl=30m -orphan ; vault token create -policy=ops -ttl=1h -orphan"
          for t in deployer ops; do VT=$(cat "$S/${t}_token") V token lookup -format=json | jq -c '.data | {display_name, policies, ttl, orphan}'; done
          echo
          run "V token revoke -self"
          run "V secrets list 2>&1 | grep -E 'Code|permission|denied' | head -2 || true"

      - name: Deploy - pipeline delivers role_id + single-use wrapped secret_id
        run: |
          eval "$RUN"; eval "$V"
          export VT=$(cat "$S/deployer_token")
          run "cat policies/deployer.hcl"
          run "./deliver.sh"
          run "curl -s -X POST -d \"{\\\"token\\\": \\\"\$(cat $APP_SECRETS_DIR/secret_id)\\\"}\" localhost:8200/v1/sys/wrapping/lookup | jq -c '.data'"
          echo "# the deployer token can NOT read the secrets that the app will receive:"
          run "V kv get -mount=secret shoplite/config 2>&1 | grep -E 'Code|permission' || true"
          run "V read database/creds/shoplite-app 2>&1 | grep -E 'Code|permission' || true"
          run "docker compose --profile app up -d app 2>&1 | tail -1"
          for i in $(seq 1 30); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done
          run "docker compose logs app 2>&1 | grep -E 'Vault|dynamic' | cut -c1-190"
          run "curl -s localhost:8080/api/config | jq ."
          run "for i in 1 2 3; do curl -s -X POST localhost:8080/api/orders -H 'Content-Type: application/json' -d '{\"items\":[1,2]}'; echo; done"

      - name: Credentials never leak into image, environment, git or logs
        run: |
          eval "$RUN"
          KEY=$(cat "$S/payment_key")
          run "docker inspect vault-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -iE 'pass|secret|token|key|vault'"
          cnt(){ echo "$ $1 | grep -c <payment_api_key value>"; eval "$1" 2>&1 | grep -c "$KEY" || true; }
          cnt "docker exec vault-app-1 env"
          cnt "docker history --no-trunc shoplite:1.0.0"
          cnt "git -C \$GITHUB_WORKSPACE grep -h ''"
          cnt "docker compose --profile app logs"
          echo
          run "docker run --rm -v \$GITHUB_WORKSPACE:/repo ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --no-banner 2>&1 | tail -2"
          echo "# the wrapped secret_id was single-use: replaying a stolen copy fails"
          run "curl -s -X POST -H \"X-Vault-Token: \$(cat $APP_SECRETS_DIR/secret_id)\" localhost:8200/v1/sys/wrapping/unwrap | jq -c ."

      - name: Least privilege - what the application token can and cannot do
        run: |
          eval "$RUN"; eval "$V"
          export VT=$(cat "$S/deployer_token")
          rid=$(V read -field=role_id auth/approle/role/shoplite-app/role-id)
          w=$(V write -wrap-ttl=60s -field=wrapping_token -f auth/approle/role/shoplite-app/secret-id)
          sid=$(VT=$w V unwrap -field=secret_id)
          VT=$(V write -field=token auth/approle/login role_id="$rid" secret_id="$sid")
          echo "$ vault write auth/approle/login role_id=<role_id> secret_id=<unwrapped secret_id>   -> application token"
          V token lookup -format=json | jq -c '.data | {display_name, policies, ttl}'
          echo
          run "V kv get -mount=secret -field=payment_api_key shoplite/config | sed 's/./*/g'; echo"
          run "V kv put -mount=secret shoplite/config payment_api_key=hacked 2>&1 | grep -E 'Code|permission' || true"
          run "V kv get -mount=secret admin/root-credentials 2>&1 | grep -E 'Code|permission' || true"
          run "V auth list 2>&1 | grep -E 'Code|permission' || true"
          run "V read database/creds/shoplite-app -format=json | jq -c '{lease_id, lease_duration, username: .data.username, password: \"(hidden)\"}'"

      - name: Dynamic credentials - per-instance users, revocation, rotation
        run: |
          eval "$RUN"; eval "$V"
          export VT=$(cat "$S/ops_token")
          PSQL='docker compose exec -T db psql -U vaultadmin -d shop'
          echo "# Vault created a separate, expiring database user for every credential request:"
          run "$PSQL -c \"SELECT rolname, rolvaliduntil FROM pg_roles WHERE rolname LIKE 'v-%' ORDER BY rolname\""
          run "V list sys/leases/lookup/database/creds/shoplite-app"
          echo "# incident response: revoke every credential of the app with one command"
          run "V lease revoke -prefix database/creds/shoplite-app"
          sleep 2
          run "$PSQL -Atc \"SELECT count(*) AS dynamic_users_left FROM pg_roles WHERE rolname LIKE 'v-%'\""
          run "curl -s -X POST localhost:8080/api/orders -H 'Content-Type: application/json' -d '{\"items\":[1]}'; echo"
          echo "# recovery: redeploy -> new wrapped secret_id -> new dynamic database user"
          run "VT=\$(cat $S/deployer_token) ./deliver.sh"
          run "docker compose --profile app restart app 2>&1 | tail -1"
          for i in $(seq 1 30); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done
          run "curl -s localhost:8080/api/config | jq -c '{source, database_user, lease_ttl}'"
          run "curl -s -X POST localhost:8080/api/orders -H 'Content-Type: application/json' -d '{\"items\":[1]}'; echo"
          echo "# the bootstrap password was rotated by Vault, so it no longer works:"
          echo "$ docker run --network vault_default -e PGPASSWORD=<bootstrap password> postgres:16.4-alpine psql -h db -U vaultadmin -d shop -c 'SELECT 1'"
          docker run --rm --network vault_default -e PGPASSWORD="$(cat "$S/bootstrap/db_bootstrap")" postgres:16.4-alpine             psql -h db -U vaultadmin -d shop -c 'SELECT 1' 2>&1 | tail -2 || true

      - name: Audit trail and emergency seal
        run: |
          eval "$RUN"; eval "$V"
          export VT=$(cat "$S/ops_token")
          echo "# every request is audited; secret values appear only as HMAC-SHA256"
          run "docker compose exec -T vault cat /vault/logs/audit.log | jq -c 'select(.type==\"response\") | {time: .time[11:19], path: .request.path, op: .request.operation, by: .auth.display_name, error}' | grep -v 'sys/wrapping/lookup' | tail -16"
          run "docker compose exec -T vault cat /vault/logs/audit.log | jq -r 'select(.type==\"response\" and .request.path==\"database/creds/shoplite-app\") | .response.data.password' | grep -v null | head -2"
          echo "# break-glass: seal Vault - every secret access stops until 3 key holders unseal it again"
          run "V operator seal"
          run "docker compose exec -T vault vault status | grep -E '^Sealed' || true"
          run "VT=\$(cat $S/deployer_token) V read auth/approle/role/shoplite-app/role-id 2>&1 | grep -iE 'sealed|Code' | head -2 || true"

      - name: Screenshot of the Vault UI
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p "$GITHUB_WORKSPACE/shots"
          python ../scripts/shot.py http://localhost:8200/ui/ "$GITHUB_WORKSPACE/shots/vault_sealed.png" --wait 4 --width 1300 --height 760

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vault-results
          path: shots/

      - name: Clean up
        if: always()
        run: |
          docker compose --profile app down -v 2>&1 | tail -1
          rm -rf "$S"
