name: Task 4 - GitOps delivery with Argo CD

on:
  push:
    branches: [main]
    paths: ["gitops/**", ".github/workflows/gitops.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUN: 'run(){ echo "$ $*"; eval "$@"; echo; }'
  KIND_VERSION: v0.25.0
  KUBECTL_VERSION: v1.31.2
  ARGOCD_VERSION: v2.13.1
  # waits until Argo CD reports the given Git revision as Synced + Healthy, prints the elapsed time
  WAIT: |
    wait_sync(){ local rev=$1 t0=$2 s
      for i in $(seq 1 120); do
        s=$(kubectl -n argocd get application shoplite -o jsonpath='{.status.sync.revision} {.status.sync.status} {.status.health.status}' 2>/dev/null || true)
        if [ "$s" = "$rev Synced Healthy" ]; then
          printf 'Argo CD: revision %s Synced + Healthy, %.1f s after the git push\n' "${rev::7}" "$(awk "BEGIN{print $(date +%s.%N)-$t0}")"; return 0; fi
        sleep 1
      done; echo "timeout, state: $s"; return 1; }

jobs:
  gitops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install kind, kubectl and the Argo CD CLI
        run: |
          eval "$RUN"
          B="$RUNNER_TEMP/bin"; mkdir -p "$B"
          curl -sSLo "$B/kind" "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          curl -sSLo "$B/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          curl -sSLo "$B/argocd" "https://github.com/argoproj/argo-cd/releases/download/$ARGOCD_VERSION/argocd-linux-amd64"
          chmod +x "$B"/*
          echo "PATH=$B:$PATH" >> "$GITHUB_ENV"; export PATH="$B:$PATH"
          run "kind version && kubectl version --client | head -1 && argocd version --client --short"

      - name: Create Kubernetes cluster (kind) and load the release images
        run: |
          eval "$RUN"
          docker build -q -t shoplite:1.0.0 app >/dev/null && docker tag shoplite:1.0.0 shoplite:2.0.0
          kind delete cluster --name gitops >/dev/null 2>&1 || true
          run "kind create cluster --name gitops --config gitops/kind.yaml --image kindest/node:v1.31.2 --wait 120s 2>&1 | grep -vE '^ *$'"
          run "kind load docker-image shoplite:1.0.0 shoplite:2.0.0 --name gitops 2>&1 | tail -2"
          run "kubectl get nodes -o wide | cut -c1-120"

      - name: Git server (Gitea) with the deployment repository
        run: |
          eval "$RUN"
          G="$RUNNER_TEMP/gitops"; mkdir -p "$G"; echo "G=$G" >> "$GITHUB_ENV"
          openssl rand -hex 12 > "$G/gitea_pw"; chmod 600 "$G/gitea_pw"
          run "kubectl apply -f gitops/bootstrap/gitea.yaml"
          run "kubectl -n gitea rollout status deploy/gitea --timeout=180s"
          for i in $(seq 1 60); do curl -sf localhost:30300/api/healthz >/dev/null && break; sleep 2; done
          echo "$ gitea admin user create --username gitops --admin --password <generated>"
          kubectl -n gitea exec deploy/gitea -- gitea admin user create --username gitops --email gitops@example.invalid \
            --password "$(cat "$G/gitea_pw")" --admin --must-change-password=false | tail -1
          curl -sf -u "gitops:$(cat "$G/gitea_pw")" -H 'Content-Type: application/json' \
            -d '{"name":"shoplite-deploy","description":"Desired state of ShopLite in Kubernetes (watched by Argo CD)","default_branch":"main"}' \
            localhost:30300/api/v1/user/repos | jq -c '{repo: .full_name, clone_url, private}'
          # the deployment repository = the manifests in gitops/apps/shoplite of this project
          rm -rf "$G/repo"; cp -r gitops/apps/shoplite "$G/repo"; cd "$G/repo"
          git init -q -b main && git config user.name "Suyash Sahu" && git config user.email "gitops@example.invalid"
          git add . && git commit -qm "Deploy ShopLite 1.0.0 (2 replicas)"
          git remote add origin "http://gitops:$(cat "$G/gitea_pw")@localhost:30300/gitops/shoplite-deploy.git"
          git push -q origin main 2>&1 | grep -v '^remote:' || true
          run "git log --oneline"
          run "ls -1"

      - name: Install Argo CD and register the application
        run: |
          eval "$RUN"
          run "kubectl create namespace argocd"
          run "kubectl apply -n argocd --server-side -f https://raw.githubusercontent.com/argoproj/argo-cd/$ARGOCD_VERSION/manifests/install.yaml | tail -4"
          kubectl -n argocd patch configmap argocd-cm --type merge --patch-file gitops/argocd/argocd-cm-patch.yaml >/dev/null
          kubectl -n argocd patch configmap argocd-cmd-params-cm --type merge -p '{"data":{"server.insecure":"true"}}' >/dev/null
          kubectl -n argocd patch svc argocd-server -p '{"spec":{"type":"NodePort","ports":[{"name":"http","port":80,"targetPort":8080,"nodePort":30081}]}}' >/dev/null
          kubectl -n argocd rollout restart deploy/argocd-server statefulset/argocd-application-controller deploy/argocd-repo-server >/dev/null
          for d in deploy/argocd-server deploy/argocd-repo-server statefulset/argocd-application-controller deploy/argocd-redis; do
            kubectl -n argocd rollout status $d --timeout=300s >/dev/null; done
          run "kubectl -n argocd get pods"
          run "cat gitops/argocd/application.yaml"
          t0=$(date +%s.%N)
          run "kubectl apply -f gitops/argocd/application.yaml"
          eval "$WAIT"; wait_sync "$(git -C "$G/repo" rev-parse HEAD)" "$t0"
          kubectl config set-context --current --namespace=argocd >/dev/null
          run "argocd app get shoplite --core | grep -vE '^(Project|Server|Namespace|SyncWindow|Sync Policy|Target|Path)'"
          run "kubectl -n shoplite get deploy,pods,svc -o wide | cut -c1-150"
          run "curl -s --retry 10 --retry-all-errors --retry-delay 1 localhost:30080/version; echo"

      - name: "Change in Git -> automatic sync (release 2.0.0, 3 replicas)"
        run: |
          eval "$RUN"; eval "$WAIT"
          cd "$G/repo"
          sed -i 's/image: shoplite:1.0.0/image: shoplite:2.0.0/; s/value: "1.0.0"/value: "2.0.0"/; s/replicas: 2/replicas: 3/' deployment.yaml
          run "git diff"
          run "git commit -qam 'Release ShopLite 2.0.0 and scale to 3 replicas' && git push -q origin main 2>&1 | grep -v '^remote:' || true"
          t0=$(date +%s.%N)
          echo "# nobody runs kubectl apply - Argo CD notices the new commit and syncs it"
          wait_sync "$(git rev-parse HEAD)" "$t0"
          kubectl -n shoplite rollout status deploy/shoplite --timeout=120s >/dev/null
          run "kubectl -n shoplite get deploy shoplite -o wide | cut -c1-150"
          run "for i in 1 2 3 4; do curl -s --retry 10 --retry-all-errors --retry-delay 1 localhost:30080/version; echo; done"
          run "argocd app history shoplite --core"

      - name: "Drift in the cluster -> self-heal back to Git"
        run: |
          eval "$RUN"
          echo "# someone changes production by hand ..."
          run "kubectl -n shoplite scale deploy shoplite --replicas=1"
          run "kubectl -n shoplite delete svc shoplite"
          t0=$(date +%s.%N)
          for i in $(seq 1 90); do
            r=$(kubectl -n shoplite get deploy shoplite -o jsonpath='{.spec.replicas}'); s=$(kubectl -n shoplite get svc shoplite -o name 2>/dev/null || true)
            [ "$r" = 3 ] && [ -n "$s" ] && break; sleep 1; done
          printf '# ... Argo CD reverted both changes to the Git state after %.1f s\n' "$(awk "BEGIN{print $(date +%s.%N)-$t0}")"
          kubectl -n shoplite rollout status deploy/shoplite --timeout=60s >/dev/null
          run "kubectl -n shoplite get deploy,svc shoplite | cut -c1-120"
          run "kubectl -n argocd get events --field-selector involvedObject.name=shoplite --sort-by=.lastTimestamp -o custom-columns=TIME:.lastTimestamp,REASON:.reason,MESSAGE:.message | tail -8 | cut -c1-170"

      - name: "Rollback = git revert"
        run: |
          eval "$RUN"; eval "$WAIT"
          cd "$G/repo"
          run "git revert --no-edit HEAD | head -1 && git push -q origin main 2>&1 | grep -v '^remote:' || true"
          t0=$(date +%s.%N)
          wait_sync "$(git rev-parse HEAD)" "$t0"
          kubectl -n shoplite rollout status deploy/shoplite --timeout=120s >/dev/null
          run "git log --oneline"
          run "kubectl -n shoplite get deploy shoplite -o wide | cut -c1-150"
          run "curl -s --retry 10 --retry-all-errors --retry-delay 1 localhost:30080/version; echo"
          echo "# put 2.0.0 back for the screenshots"
          git revert --no-edit HEAD >/dev/null && git push -q origin main 2>&1 | grep -v '^remote:' || true
          wait_sync "$(git rev-parse HEAD)" "$(date +%s.%N)"
          kubectl -n shoplite rollout status deploy/shoplite --timeout=120s >/dev/null

      - name: Screenshots
        run: |
          pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p shots
          pw=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d)
          python scripts/argo_shot.py http://localhost:30081 "$pw" shots
          python scripts/shot.py http://localhost:30300/gitops/shoplite-deploy/commits/branch/main shots/gitea_commits.png --wait 2 --height 760
          python scripts/shot.py http://localhost:30080/ shots/app.png --wait 1 --width 1100 --height 480

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitops-results
          path: shots/

      - name: Clean up
        if: always()
        run: kind delete cluster --name gitops 2>&1 | tail -1
