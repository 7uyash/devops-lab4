# Secret management: HashiCorp Vault (server mode, file storage, audit log) + PostgreSQL + the app.
# The app gets NO password from the image, compose file or environment - it logs in to Vault with
# AppRole and receives short-lived, per-instance database credentials.
services:
  vault:
    image: hashicorp/vault:1.18.1
    command: ["vault", "server", "-config=/vault/config/config.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["8200:8200"]
    volumes:
      - ./config.hcl:/vault/config/config.hcl:ro
      - ./policies:/vault/policies:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: vaultadmin
      # bootstrap password from a file generated by the pipeline; Vault rotates it right after setup
      # (database/rotate-root), so afterwards no human knows the database admin password
      POSTGRES_PASSWORD_FILE: /run/bootstrap/db_bootstrap
    volumes:
      - ./db-init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ${BOOTSTRAP_DIR:-./.bootstrap}:/run/bootstrap:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vaultadmin", "-d", "shop"]
      interval: 2s
      retries: 30

  app:
    image: shoplite:1.0.0
    profiles: ["app"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/role_id
      VAULT_SECRET_ID_FILE: /run/secrets/secret_id
      VAULT_DB_ROLE: shoplite-app
      VAULT_KV_PATH: secret/data/shoplite/config
      DB_HOST: db
      DB_NAME: shop
    volumes:
      - ${APP_SECRETS_DIR:-./.app-secrets}:/run/secrets:ro
    ports: ["8080:8000"]

volumes:
  vault-data:
  vault-logs:
