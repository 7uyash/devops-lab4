upstream stable { server stable:8000; keepalive 16; }
upstream canary { server canary:8000; keepalive 16; }

# split/weight.conf holds:   split_clients "${http_x_user}" $track { 10% canary; * stable; }
# The same user always lands on the same track, so a user never flips between versions.
include /etc/nginx/split/weight.conf;

# testers can force the canary with the header  X-Canary: always
map $http_x_canary $route {
    always  canary;
    default $track;
}

server {
    listen 80;
    location / {
        proxy_pass http://$route;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header X-Route $route always;
    }
}
