# Canary: stable and canary versions run side by side; nginx sends a percentage of USERS to the canary
# (sticky per user via a hash of the X-User header). Prometheus scrapes both tracks for the analysis.
services:
  router:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./split:/etc/nginx/split               # weight.conf is rewritten by canary.py at every step
    depends_on: [stable, canary]

  stable:
    image: shoplite:${STABLE_VERSION:-1.0.0}
    environment: { APP_VERSION: "${STABLE_VERSION:-1.0.0}", APP_TRACK: stable, APP_INSTANCE: stable }

  canary:
    image: shoplite:${CANARY_VERSION:-1.0.0}
    environment:
      APP_VERSION: "${CANARY_VERSION:-1.0.0}"
      APP_TRACK: canary
      APP_INSTANCE: canary
      ERROR_RATE: "${CANARY_ERROR_RATE:-0}"
      EXTRA_LATENCY_MS: "${CANARY_EXTRA_LATENCY_MS:-0}"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
