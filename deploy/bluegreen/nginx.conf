upstream blue  { server blue:8000;  keepalive 16; }
upstream green { server green:8000; keepalive 16; }

# active.conf contains a single line:  set $live blue;   (or green)
server {
    listen 80;
    include /etc/nginx/active/active.conf;

    location / {
        proxy_pass http://$live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Live-Env $live always;
    }
    # lets operators test the idle environment directly before the switch
    location /preview/blue/  { proxy_pass http://blue/; }
    location /preview/green/ { proxy_pass http://green/; }
}
