# Blue-green: two identical environments behind one router. Only one of them receives live traffic;
# a release is always deployed to the idle one, tested, and then the router is switched.
services:
  router:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./active:/etc/nginx/active          # active.conf decides blue or green
    depends_on: [blue, green]

  blue:
    image: shoplite:${BLUE_VERSION:-1.0.0}
    environment: { APP_VERSION: "${BLUE_VERSION:-1.0.0}", APP_COLOR: blue, APP_INSTANCE: blue,
                   ERROR_RATE: "${BLUE_ERROR_RATE:-0}" }

  green:
    image: shoplite:${GREEN_VERSION:-1.0.0}
    environment: { APP_VERSION: "${GREEN_VERSION:-1.0.0}", APP_COLOR: green, APP_INSTANCE: green,
                   ERROR_RATE: "${GREEN_ERROR_RATE:-0}" }
