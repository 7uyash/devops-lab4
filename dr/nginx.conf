# app1 = primary site, app2 = DR site (receives traffic only when app1 fails)
upstream shop {
    server app1:8000 max_fails=1 fail_timeout=10s;
    server app2:8000 backup;
}
server {
    listen 80;
    location / {
        proxy_pass http://shop;
        proxy_connect_timeout 1s;
        # retry on the backup when app1 cannot be reached (the request never reached app1, so retrying
        # a POST is safe for "error"/"timeout" at connect time)
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    }
}
