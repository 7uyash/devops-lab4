# app1 = primary site, app2 = DR site (receives traffic only when app1 fails)
upstream shop {
    server app1:8000 max_fails=1 fail_timeout=10s;
    server app2:8000 backup;
}
server {
    listen 80;
    location / {
        proxy_pass http://shop;
        proxy_connect_timeout 500ms;
        # retry on the DR-site app when app1 cannot be reached. POST is NOT retried after it was sent
        # (no "non_idempotent"), so an order can never be stored twice.
        proxy_next_upstream error timeout http_502;
    }
}
