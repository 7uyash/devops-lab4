apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoplite
  labels: { app: shoplite }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: shoplite }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: shoplite }
    spec:
      containers:
        - name: shoplite
          image: shoplite:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - { name: APP_VERSION, value: "1.0.0" }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
