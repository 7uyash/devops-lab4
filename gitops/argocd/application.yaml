# Argo CD Application: the Git repository is the single source of truth for namespace "shoplite".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/gitops/shoplite-deploy.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite
  syncPolicy:
    automated:
      prune: true      # resources removed from Git are deleted from the cluster
      selfHeal: true   # manual changes in the cluster are reverted to the Git state
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 1m }
