# local Kubernetes cluster for the GitOps demo (1 control-plane + 1 worker)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 30080 }   # ShopLite (NodePort)
      - { containerPort: 30081, hostPort: 30081 }   # Argo CD UI/API
      - { containerPort: 30300, hostPort: 30300 }   # Gitea (Git server)
  - role: worker
